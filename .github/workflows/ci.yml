name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (hash-pinned) dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements.lock
          python -m pip install "pytest>=8" "httpx>=0.27" "playwright>=1.47"
      - name: Static checks (Python compiles, UI parses)
        run: |
          python -m compileall -q hnb tools tests plugins examples
          node --check web/app.js
      - name: Tests — clean checkout (including the Home Hub in Chrome)
        env:
          HNB_REQUIRE_BROWSER: "1"
        run: python -m pytest
      - name: Tests — git archive export (no .git, nothing untracked)
        run: |
          mkdir -p /tmp/export && git archive HEAD | tar -x -C /tmp/export
          cd /tmp/export && python -m pytest -p no:cacheprovider
      - name: Shell syntax
        run: for f in install.sh bin/* tests/vm/*.sh; do bash -n "$f"; done
      - name: Build the hub image
        run: docker build -f deploy/Dockerfile -t hnb-starter:ci .
      - name: Container smoke test (read-only, non-root, no capabilities)
        run: |
          mkdir -p /tmp/hnb/data /tmp/hnb/backups /tmp/hnb/logs /tmp/hnb/secrets
          head -c 32 /dev/urandom > /tmp/hnb/secrets/vault.key && chmod 600 /tmp/hnb/secrets/vault.key
          sudo chown -R 10001:10001 /tmp/hnb
          docker run -d --name hub --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:8780:8780 -v /tmp/hnb/data:/var/lib/hnb/data -v /tmp/hnb/backups:/var/lib/hnb/backups \
            -v /tmp/hnb/logs:/var/lib/hnb/logs -v /tmp/hnb/secrets/vault.key:/run/secrets/vault_key:ro hnb-starter:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8780/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8780/api/health | grep -q '"setup_required":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/api/home)" = 401
          docker exec hub python -m hnb.cli healthcheck
          docker logs hub
